# Povezivanje na H2 bazu u memoriji sa ?istom PostgreSQL simulacijom
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate pode?avanja - validacija i H2 dijalekt
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway mora da izvr?i migracije nad H2 bazom pre pokretanja Hibernate validacije
spring.flyway.enabled=true
spring.flyway.clean-disabled=false