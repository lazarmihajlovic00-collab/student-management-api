name: CI/CD Pipeline with Docker Hub

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # FAZA 1: Testiranje i verifikacija (CI)
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and Run Tests
        run: mvn clean verify

  # FAZA 2: Pakovanje u Docker sliku i slanje na Docker Hub (CD)
  build-and-push-docker:
    needs: build-and-test # Pokreće se SAMO ako faza 1 (testovi) prođe uspešno!
    runs-on: ubuntu-latest
    # Pokrećemo slanje na Docker Hub samo kada se radi push na main granu (ne za Pull Request-ove)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setovanje Docker Buildx alata koji omogućava napredne build opcije
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logovanje na Docker Hub nalog koristeći tajne unete u GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build-ovanje slike preko Dockerfile-a i push-ovanje na Docker Hub profil
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            lazar777/student-management-api:latest
            lazar777/student-management-api:${{ github.sha }}